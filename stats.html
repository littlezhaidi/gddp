<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數據統計 - littlezhaidi demonlist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="assets/icons/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
    <link rel="shortcut icon" href="assets/icons/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png" />
    <link rel="manifest" href="assets/site.webmanifest" />
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen pb-12">

    <!-- Home Page Button -->
    <div class="max-w-6xl mx-auto px-4 pt-6 md:pt-8">
        <a href="/" class="inline-flex items-center gap-2 text-slate-400 hover:text-violet-300 transition-colors">
            <i class="fa-solid fa-arrow-left"></i> 返回關卡列表
        </a>
    </div>

    <!-- Title -->
    <main class="max-w-6xl mx-auto px-4 mt-6 space-y-6">

        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 md:p-8 items-center">
            <h1 class="text-2xl md:text-4xl font-extrabold text-white tracking-wide flex items-center gap-3 mb-8">
              <i class="fa-solid fa-chart-line text-violet-300"></i> 數據統計
            </h1>
          
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 text-center">
                <div class="bg-slate-800/80 border border-slate-600/60 p-4 rounded-xl backdrop-blur-md">
                    <span class="block text-slate-400 text-xs">hardest</span>
                    <span id="stat-hardest" class="text-base md:text-xl font-bold text-amber-300 block truncate mt-1 hover:underline">-</span>
                </div>
                <div class="bg-slate-800/80 border border-slate-600/60 p-4 rounded-xl backdrop-blur-md">
                    <span class="block text-slate-400 text-xs">demon count</span>
                    <span id="stat-total" class="text-lg md:text-2xl font-bold text-amber-300">0</span>
                </div>
                <div class="bg-slate-800/80 border border-slate-600/60 p-4 rounded-xl backdrop-blur-md">
                    <span class="block text-slate-400 text-xs">total attempts</span>
                    <span id="total-attempts" class="text-base md:text-xl font-bold text-amber-300 block truncate mt-1">-</span>
                </div>
                <div class="bg-slate-800/80 border border-slate-600/60 p-4 rounded-xl backdrop-blur-md">
                    <span class="block text-slate-400 text-xs">average enjoyment</span>
                    <span id="stat-avg-enjoyment" class="text-lg md:text-2xl font-bold text-amber-300">0</span>
                </div>
            </div>
        </div>
      

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 items-start">
            <section class="bg-slate-900 bg-cardBg p-6 rounded-2xl border border-slate-800 shadow-xl">
                <h2 class="text-2xl font-black text-white mb-6 tracking-wide flex items-center gap-2.5">
                    <span>Difficulty spread</span>
                </h2>

                <div class="overflow-x-auto">
                    <table class="w-full border-collapse">
                        <tbody id="difficulty-table-body">
                        </tbody>
                    </table>
                </div>
            </section>

            <section class="bg-slate-900 bg-cardBg p-6 rounded-2xl border border-slate-800 shadow-xl">
                <h2 class="text-2xl font-black text-white mb-6 tracking-wide flex items-center gap-2.5">
                    <span>Enjoyment spread</span>
                </h2>

                <div class="overflow-x-auto">
                    <table class="w-full border-collapse">
                        <tbody id="enjoyment-table-body">
                        </tbody>
                    </table>
                </div>
            </section>

        </div>
      
    </main>
    <!-- Footer Section -->
    <footer class="mt-16 py-8 bg-slate-900/80 border-t border-slate-800/80 text-slate-400 text-xs">
        <div class="max-w-6xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-4">
        
            <div class="flex items-center gap-2 text-slate-500">
                <span>assets from GDDL & level thumbnails mod</span>
            </div>
          
            <div class="flex items-center gap-6">
                <a href="https://github.com/littlezhaidi/gddp" 
                    target="_blank" 
                    rel="noopener noreferrer" 
                    class="flex items-center gap-2 hover:text-violet-100 transition-colors text-xs md:text-sm font-medium">
                    <i class="fa-brands fa-github"></i>
                    <span>github repo</span>
                </a>
            
                <a href="about.html" 
                    rel="noopener noreferrer" 
                    class="flex items-center gap-2 hover:text-violet-300 transition-colors text-xs md:text-sm font-medium">
                    <i class="fa-solid fa-circle-info"></i>
                    <span>about site</span>
                </a>
            
                <a href="https://www.youtube.com/channel/UC_6IdaITcomx1Ziy8LYLs1g/"
                    target="_blank"
                    rel="noopener noreferrer" 
                    class="flex items-center gap-2 hover:text-rose-500 transition-colors text-xs md:text-sm font-medium">
                    <i class="fa-brands fa-youtube"></i>
                    <span>youtube channel</span>
                </a>
            </div>
        
        </div>
    </footer>

    <script type="module" src="js/stats.js"></script>
</body>

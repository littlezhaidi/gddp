<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>littlezhaidi demonlist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="assets/icons/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
    <link rel="shortcut icon" href="assets/icons/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png" />
    <link rel="manifest" href="assets/site.webmanifest" />
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen pb-12">

    <!-- Home Page Button -->
    <div class="max-w-6xl mx-auto px-4 pt-6 md:pt-8">
        <a href="/" class="inline-flex items-center gap-2 text-slate-400 hover:text-violet-300 transition-colors">
              <i class="fa-solid fa-arrow-left"></i> 返回關卡列表
        </a>
    </div>

    <!-- Title -->
    <main class="max-w-6xl mx-auto px-4 mt-6 space-y-6">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 md:p-8 flex justify-between items-center">
              <div>
                  <h1 class="text-2xl md:text-4xl font-extrabold text-white tracking-wide flex items-center gap-3">
                      <i class="fa-solid fa-clock-rotate-left text-violet-300"></i> 更新日誌
                  </h1>
                  <p class="text-slate-400 text-xs md:text-base mt-1">＊排名資料來自GDDL</p>
              </div>
        </div>
        <!-- Changelog Container -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 md:p-8">
            <div id="changelog-container" class="relative border-l-2 border-slate-800 ml-2 md:ml-4 pl-6 md:pl-8 space-y-8">
                <!-- Dynamic rendering via JS -->
            </div>
        </div>
    </main>

    <!-- Footer Section -->
    <footer class="mt-16 py-8 bg-slate-900/80 border-t border-slate-800/80 text-slate-400 text-xs">
        <div class="max-w-6xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-4">
        
            <div class="flex items-center gap-2 text-slate-500">
                <span>assets from GDDL & level thumbnails mod</span>
            </div>
          
            <div class="flex items-center gap-6">
                <a href="https://github.com/littlezhaidi/gddp" 
                    target="_blank" 
                    rel="noopener noreferrer" 
                    class="flex items-center gap-2 hover:text-violet-100 transition-colors text-xs md:text-sm font-medium">
                    <i class="fa-brands fa-github"></i>
                    <span>github repo</span>
                </a>
            
                <a href="about.html" 
                    target="_blank" 
                    rel="noopener noreferrer" 
                    class="flex items-center gap-2 hover:text-violet-300 transition-colors text-xs md:text-sm font-medium">
                    <i class="fa-solid fa-circle-info"></i>
                    <span>about site</span>
                </a>
            
                <a href="https://www.youtube.com/channel/UC_6IdaITcomx1Ziy8LYLs1g/"
                    target="_blank"
                    rel="noopener noreferrer" 
                    class="flex items-center gap-2 hover:text-rose-500 transition-colors text-xs md:text-sm font-medium">
                    <i class="fa-brands fa-youtube"></i>
                    <span>youtube channel</span>
                </a>

        </div>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>littlezhaidi demonlist</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="shortcut icon" href="assets/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
  <link rel="manifest" href="assets/site.webmanifest" />
  <style>
    body { background-color: #0b0c10; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    
    .card {
      cursor: pointer;
      box-shadow: 0 0 12px rgba(138, 1, 148, 0.33);
      transition: all 0.3s ease;
    }
    .card:hover {
      box-shadow: 0 0 22px rgba(196, 180, 255, 1); 
      transform: translateY(-4px);
      border-color: rgba(51, 65, 85, 1);
    }
  </style>
</head>
<body class="text-gray-100 min-h-screen pb-12">

<!-- Header Section -->
<header class="relative py-12 text-center border-b border-slate-800 bg-cover bg-center overflow-hidden" 
        style="background-image: url('assets/banner.png');">
  
  <div class="absolute inset-0 bg-slate-950/75"></div>

  <div class="relative z-10">
    <h1 class="text-3xl md:text-6xl font-extrabold tracking-wide text-transparent bg-clip-text text-violet-300 drop-shadow-md">
      littlezhaidi demon list
    </h1>
    <p class="text-slate-300 mt-6 text-sm md:text-base font-medium drop-shadow">個人評分＆關卡心得</p>

    <!-- Stats Bar -->
    <div class="max-w-4xl mx-auto grid grid-cols-2 sm:grid-cols-3 gap-4 mt-8 px-4">
      <div class="bg-slate-900/80 border border-slate-700/60 p-4 rounded-xl backdrop-blur-md">
        <span class="block text-slate-400 text-xs">hardest</span>
        <span id="stat-hardest" class="text-base md:text-xl font-bold text-amber-300 block truncate mt-1" title="">-</span>
      </div>
      <div class="bg-slate-900/80 border border-slate-700/60 p-4 rounded-xl backdrop-blur-md">
        <span class="block text-slate-400 text-xs">demon count</span>
        <span id="stat-total" class="text-lg md:text-2xl font-bold text-amber-300">0</span>
      </div>
      <div class="bg-slate-900/80 border border-slate-700/60 p-4 rounded-xl backdrop-blur-md">
        <span class="block text-slate-400 text-xs">average enjoyment</span>
        <span id="stat-avg-enjoyment" class="text-lg md:text-2xl font-bold text-amber-300">0</span>
      </div>
    </div>
  </div>

</header>

  <!-- Controls Section -->
  <main class="max-w-7xl mx-auto mt-8 px-4">
    <div class="flex flex-col md:flex-row gap-4 justify-between items-center mb-8">
      <!-- Search Input -->
      <div class="relative w-full md:w-80">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3.5 text-slate-400"></i>
        <input type="text" id="search-input" placeholder="搜尋關卡名稱、創作者或 ID..."
               class="w-full bg-slate-800 text-slate-200 pl-10 pr-4 py-2 rounded-lg border border-slate-700 focus:outline-none focus:border-yellow-700 text-sm">
      </div>

      <!-- Sort Filter -->
      <div class="flex gap-2 w-full md:w-auto">
        <select id="sort-key-select" class="bg-slate-800 text-slate-200 px-4 py-2 rounded-lg border border-slate-700 text-sm focus:outline-none focus:border-yellow-700 w-full">
          <option value="date" selected>clear date</option>
          <option value="tier">difficulty</option>
          <option value="enjoyment">enjoyment</option>
        </select>
        <button id="sort-order-btn" class="bg-slate-900 border border-slate-800 text-slate-200 text-xs md:text-sm rounded-lg px-3 py-2 hover:bg-slate-800 flex items-center gap-1.5 transition-colors">
          <i id="sort-order-icon" class="fa-solid fa-arrow-down-wide-short"></i>
          <span id="sort-order-text">降序</span>
        </button>
      </div>
    </div>

    <!-- Cards Container -->
    <div id="cards-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Dynamic rendering via JS -->
    </div>
  </main>

  <!-- Footer Section -->
  <footer class="mt-16 py-8 bg-slate-900/80 border-t border-slate-800/80 text-slate-400 text-xs">
    <div class="max-w-6xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-4">
    
      <div class="flex items-center gap-2 text-slate-500">
        <span>assets from GDDL & level thumbnails mod, website generated by AI</span>
      </div>

      <div class="flex items-center gap-6">
        <a href="https://github.com/littlezhaidi/gddp" 
           target="_blank" 
           rel="noopener noreferrer" 
           class="flex items-center gap-2 hover:text-violet-100 transition-colors text-sm font-medium">
          <i class="fa-brands fa-github text-base"></i>
          <span>github repo</span>
        </a>

        <a href="https://gdladder.com/profile/35115" 
           target="_blank" 
           rel="noopener noreferrer" 
           class="flex items-center gap-2 hover:text-violet-300 transition-colors text-sm font-medium">
          <i class="fa-solid fa-id-card text-base text-cyan-400"></i>
          <span>gddl profile</span>
        </a>

        <a href="https://www.youtube.com/channel/UC_6IdaITcomx1Ziy8LYLs1g/"
          target="_blank"
          rel="noopener noreferrer" 
          class="flex items-center gap-2 hover:text-rose-500 transition-colors text-sm font-medium">
          <i class="fa-brands fa-youtube"></i>
          <span>youtube channel</span>
        </a>
      </div>

    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
